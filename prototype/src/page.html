<title>Baharat Sort</title>
<meta name="claude:viewport-fit-sides" content="cover" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Rakkas&family=Alegreya+Sans:wght@400;500;700;800&display=swap"
/>
<style>
  /* Yerleşim: tek ekranlık oyun. Üstte tezgâh tabelası, ortada ahşap raflarda kavanozlar, altta bakır güçlendiriciler.
     Tek, bilinçli bir görünüm: akşam ışığında Mısır Çarşısı (koyu tema sabit). */
  :root {
    --wall: #2e1c14;
    --wall-2: #4a2c1c;
    --wood: #8a5a33;
    --wood-dark: #5b391f;
    --brass: #d6a24a;
    --brass-dark: #8d6220;
    --cream: #fbefd9;
    --cream-soft: #e6d2b0;
    --ink: #2a170d;
    --glow: #ffc46b;
    --danger: #e0533d;
    --leaf: #8fcc69;
    --panel: #3a2418;
    --panel-2: #4d3122;
    --font-display: 'Rakkas', 'Georgia', serif;
    --font-body: 'Alegreya Sans', 'Trebuchet MS', system-ui, sans-serif;
    color-scheme: dark;
  }
  *,
  *::before,
  *::after {
    box-sizing: border-box;
  }
  html,
  body {
    height: 100%;
  }
  body {
    background: var(--wall);
    color: var(--cream);
    font-family: var(--font-body);
    font-size: 16px;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  button {
    font: inherit;
    color: inherit;
    cursor: pointer;
  }
  button:focus-visible {
    outline: 3px solid var(--glow);
    outline-offset: 2px;
  }
  #app {
    position: relative;
    height: 100%;
    max-width: 620px;
    margin: 0 auto;
    display: grid;
    grid-template-rows: auto auto 1fr auto;
    padding-left: max(12px, env(safe-area-inset-left, 0px));
    padding-right: max(12px, env(safe-area-inset-right, 0px));
    background:
      radial-gradient(120% 60% at 50% 0%, rgba(255, 196, 107, 0.22), transparent 60%),
      linear-gradient(180deg, var(--wall-2) 0%, var(--wall) 70%);
    overflow: hidden;
  }
  /* Dükkânın içi: arka plan sahnesi */
  #scene {
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    /* Gerçek Mısır Çarşısı fotoğrafı (Joseolgon, CC-BY 4.0): bulanık ve karartılmış; ortası daha koyu. */
    background:
      radial-gradient(ellipse 70% 55% at 50% 52%, rgba(22, 11, 5, 0.62), rgba(22, 11, 5, 0.25) 75%),
      linear-gradient(
        180deg,
        rgba(22, 11, 5, 0.7),
        rgba(22, 11, 5, 0) 18%,
        rgba(22, 11, 5, 0) 75%,
        rgba(22, 11, 5, 0.6)
      ),
      url(__ASSET:bg_bazaar.jpg__) center 35% / cover;
  }
  #scene svg {
    width: 100%;
    height: 100%;
    display: block;
  }
  .walker {
    animation: walk 16s linear infinite;
  }
  .walker.w2 {
    animation-duration: 23s;
    animation-delay: -9s;
    animation-direction: reverse;
  }
  @keyframes walk {
    0% {
      transform: translateX(-70px);
    }
    100% {
      transform: translateX(110px);
    }
  }
  #props {
    position: absolute;
    right: max(10px, env(safe-area-inset-right, 0px));
    bottom: calc(86px + env(safe-area-inset-bottom, 0px));
    width: 104px;
    z-index: 2;
    pointer-events: none;
  }
  #props svg {
    display: block;
    width: 100%;
    overflow: visible;
  }
  .steam {
    animation: steam 3.2s ease-in-out infinite;
  }
  .steam.s2 {
    animation-delay: -1.6s;
  }
  @keyframes steam {
    0% {
      opacity: 0;
      transform: translateY(4px);
    }
    40% {
      opacity: 1;
    }
    100% {
      opacity: 0;
      transform: translateY(-8px);
    }
  }
  /* Tavan kemerleri ve lambalar */
  #ceiling {
    position: absolute;
    inset: 0 0 auto 0;
    height: 210px;
    pointer-events: none;
    z-index: 0;
  }
  .lamp {
    transform-origin: 50% 0;
    animation: sway 6s ease-in-out infinite alternate;
  }
  .lamp:nth-child(2) {
    animation-duration: 7.5s;
    animation-delay: -2s;
  }
  .lamp:nth-child(3) {
    animation-duration: 5.4s;
    animation-delay: -1s;
  }
  @keyframes sway {
    from {
      transform: rotate(-2.2deg);
    }
    to {
      transform: rotate(2.2deg);
    }
  }
  header {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 8px;
    padding-block: 10px 4px;
  }
  .sign {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    line-height: 1;
  }
  .sign .level {
    font-family: var(--font-display);
    font-size: 26px;
    letter-spacing: 0.02em;
    color: var(--cream);
    text-shadow: 0 2px 0 rgba(0, 0, 0, 0.35);
  }
  .badge {
    display: inline-block;
    margin-top: 4px;
    padding: 2px 9px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .badge.hard {
    background: #f07a16;
    color: var(--ink);
  }
  .badge.veryHard {
    background: var(--danger);
    color: var(--cream);
  }
  .badge.relief {
    background: rgba(143, 204, 105, 0.2);
    color: var(--leaf);
  }
  .iconbtn {
    width: 44px;
    height: 44px;
    flex: none;
    border-radius: 14px;
    border: 1px solid rgba(214, 162, 74, 0.45);
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.08), rgba(0, 0, 0, 0.15));
    display: grid;
    place-items: center;
  }
  .iconbtn svg {
    width: 22px;
    height: 22px;
  }
  .coins {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px 6px 6px;
    border-radius: 999px;
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(214, 162, 74, 0.35);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    min-width: 76px;
  }
  .coin {
    width: 22px;
    height: 22px;
    flex: none;
  }
  #info {
    position: relative;
    z-index: 2;
    text-align: center;
    font-size: 12.5px;
    color: var(--cream-soft);
    opacity: 0.75;
    min-height: 18px;
    padding-inline: 8px;
  }
  #caption {
    position: absolute;
    left: 0;
    right: 0;
    top: 6px;
    text-align: center;
    font-size: 15px;
    font-weight: 700;
    color: var(--glow);
    z-index: 3;
    pointer-events: none;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
  }
  #stage {
    position: relative;
    z-index: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 6px;
    padding-block: 26px 64px;
  }
  .row {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    padding-inline: 6px;
  }
  .plank {
    position: absolute;
    left: -4px;
    right: -4px;
    bottom: -12px;
    height: 16px;
    border-radius: 3px;
    background:
      linear-gradient(180deg, rgba(255, 210, 150, 0.25), rgba(0, 0, 0, 0) 30%, rgba(0, 0, 0, 0.35)),
      url(__ASSET:wood_shelf.jpg__) 0 0 / 256px 64px;
    box-shadow:
      0 6px 10px rgba(0, 0, 0, 0.45),
      inset 0 1px 0 rgba(255, 220, 160, 0.4);
  }
  .jar {
    position: relative;
    z-index: 1;
    background: none;
    border: 0;
    padding: 0;
    transition: transform 160ms cubic-bezier(0.3, 0.7, 0.3, 1);
    touch-action: manipulation;
  }
  .jar svg {
    display: block;
    width: 100%;
    height: auto;
    overflow: visible;
  }
  .jar.lifted {
    transform: translateY(-14px);
  }
  .jar.lifted .glass {
    stroke: var(--glow);
  }
  .jar.hint-src .glass,
  .jar.hint-dst .glass {
    stroke: var(--leaf);
    stroke-width: 3;
  }
  .jar.hint-src {
    animation: nudge 0.9s ease-in-out infinite;
  }
  .jar.hint-dst::after {
    content: '';
    position: absolute;
    left: 50%;
    top: -22px;
    width: 0;
    height: 0;
    border: 9px solid transparent;
    border-top-color: var(--leaf);
    transform: translateX(-50%);
    animation: bob 0.9s ease-in-out infinite;
  }
  @keyframes nudge {
    50% {
      transform: translateY(-8px);
    }
  }
  @keyframes bob {
    50% {
      transform: translate(-50%, 6px);
    }
  }
  .grow {
    transform-box: fill-box;
    transform-origin: 50% 100%;
    animation: grow 330ms ease-out both;
    animation-delay: 60ms;
  }
  @keyframes grow {
    from {
      transform: scaleY(0);
    }
  }
  .cork-drop {
    animation: cork 520ms cubic-bezier(0.25, 1.6, 0.5, 1) both;
  }
  @keyframes cork {
    from {
      transform: translateY(-46px) rotate(-14deg);
      opacity: 0;
    }
    35% {
      opacity: 1;
    }
  }
  #fx {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 4;
    overflow: visible;
  }
  /* Tezgâh ve kedi */
  #counter {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: calc(96px + env(safe-area-inset-bottom, 0px));
    z-index: 0;
    pointer-events: none;
    border-top: 6px solid transparent;
    border-image: linear-gradient(180deg, #c48a4f, #7a4a26) 1;
    background:
      linear-gradient(180deg, rgba(0, 0, 0, 0.15), rgba(0, 0, 0, 0.45)),
      url(__ASSET:wood_counter.jpg__) 0 0 / 300px 300px;
    box-shadow: 0 -6px 14px rgba(0, 0, 0, 0.45);
  }
  #cat {
    position: absolute;
    left: max(14px, env(safe-area-inset-left, 0px));
    bottom: calc(88px + env(safe-area-inset-bottom, 0px));
    width: 78px;
    z-index: 2;
    background: none;
    border: 0;
    padding: 0;
  }
  #cat .breath {
    transform-box: fill-box;
    transform-origin: 50% 100%;
    animation: breathe 3.6s ease-in-out infinite;
  }
  @keyframes breathe {
    50% {
      transform: scaleY(1.05);
    }
  }
  .zz {
    font-family: var(--font-display);
    fill: var(--cream-soft);
    animation: zz 3.6s ease-in-out infinite;
  }
  @keyframes zz {
    0% {
      opacity: 0;
      transform: translate(0, 4px);
    }
    40% {
      opacity: 0.8;
    }
    100% {
      opacity: 0;
      transform: translate(6px, -10px);
    }
  }
  /* Güçlendiriciler */
  #boosters {
    position: relative;
    z-index: 2;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    padding-block: 8px max(12px, env(safe-area-inset-bottom, 0px));
  }
  .boost {
    position: relative;
    min-height: 62px;
    border-radius: 16px;
    border: 1px solid rgba(255, 220, 160, 0.35);
    background: linear-gradient(180deg, #e2b25e, var(--brass) 45%, var(--brass-dark));
    color: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    font-size: 13px;
    font-weight: 800;
    box-shadow:
      0 4px 0 #5e3f12,
      0 8px 14px rgba(0, 0, 0, 0.35);
    transition:
      transform 80ms,
      box-shadow 80ms,
      filter 120ms;
  }
  .boost:active {
    transform: translateY(3px);
    box-shadow:
      0 1px 0 #5e3f12,
      0 4px 8px rgba(0, 0, 0, 0.35);
  }
  .boost svg {
    width: 24px;
    height: 24px;
  }
  .boost[disabled] {
    filter: grayscale(0.85) brightness(0.7);
    cursor: default;
  }
  .boost .count {
    position: absolute;
    top: -7px;
    right: -5px;
    min-width: 22px;
    height: 22px;
    padding: 0 5px;
    border-radius: 11px;
    background: var(--panel);
    color: var(--cream);
    border: 1.5px solid var(--brass);
    font-size: 12px;
    display: grid;
    place-items: center;
    font-variant-numeric: tabular-nums;
  }
  .boost .count.price {
    background: var(--ink);
    color: var(--glow);
  }
  .boost.glow {
    animation: glow 1.1s ease-in-out infinite;
  }
  @keyframes glow {
    50% {
      box-shadow:
        0 4px 0 #5e3f12,
        0 0 0 6px rgba(143, 204, 105, 0.55),
        0 0 26px rgba(143, 204, 105, 0.8);
    }
  }
  /* Katmanlar: modal kartlar */
  .veil {
    position: absolute;
    inset: 0;
    z-index: 20;
    display: grid;
    place-items: center;
    padding: 20px;
    background: rgba(20, 10, 5, 0.66);
    animation: fade 180ms ease-out both;
  }
  @keyframes fade {
    from {
      opacity: 0;
    }
  }
  .card {
    width: min(100%, 360px);
    max-height: 100%;
    overflow: auto;
    border-radius: 22px;
    background:
      radial-gradient(120% 70% at 50% 0%, rgba(255, 196, 107, 0.18), transparent 70%),
      linear-gradient(180deg, var(--panel-2), var(--panel));
    border: 1.5px solid rgba(214, 162, 74, 0.55);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
    padding: 22px 20px 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    text-align: center;
    animation: rise 240ms cubic-bezier(0.2, 0.8, 0.3, 1) both;
  }
  @keyframes rise {
    from {
      transform: translateY(18px);
      opacity: 0;
    }
  }
  .card h2 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 30px;
    line-height: 1.05;
    color: var(--glow);
    text-wrap: balance;
  }
  .card p {
    margin: 0;
    color: var(--cream-soft);
    line-height: 1.45;
  }
  .lines {
    display: grid;
    gap: 6px;
    text-align: left;
    background: rgba(0, 0, 0, 0.22);
    border-radius: 14px;
    padding: 10px 14px;
    font-variant-numeric: tabular-nums;
  }
  .lines div {
    display: flex;
    justify-content: space-between;
    gap: 12px;
  }
  .lines .total {
    border-top: 1px solid rgba(214, 162, 74, 0.35);
    padding-top: 6px;
    font-weight: 800;
    color: var(--cream);
  }
  .btn {
    min-height: 50px;
    border-radius: 15px;
    border: 0;
    padding: 10px 16px;
    font-weight: 800;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn.primary {
    background: linear-gradient(180deg, #ffd98a, var(--glow) 50%, #e39b2f);
    color: var(--ink);
    box-shadow: 0 4px 0 #8d5a14;
  }
  .btn.ad {
    background: linear-gradient(180deg, #a6dd84, var(--leaf) 50%, #5e9c3c);
    color: var(--ink);
    box-shadow: 0 4px 0 #3c6a22;
  }
  .btn.plain {
    background: rgba(255, 255, 255, 0.08);
    color: var(--cream);
    border: 1px solid rgba(214, 162, 74, 0.35);
  }
  .btn[disabled] {
    opacity: 0.45;
    cursor: default;
  }
  .btn small {
    font-weight: 600;
    opacity: 0.75;
  }
  .stack {
    display: grid;
    gap: 10px;
  }
  .gift {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .chip {
    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(143, 204, 105, 0.16);
    color: var(--leaf);
    font-weight: 800;
    font-size: 13px;
  }
  /* Ayarlar ve seviye listesi */
  .sheet {
    width: min(100%, 420px);
    text-align: left;
  }
  .toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    min-height: 46px;
    padding: 4px 2px;
    border-bottom: 1px solid rgba(214, 162, 74, 0.18);
  }
  .toggle input {
    width: 46px;
    height: 26px;
    accent-color: var(--leaf);
  }
  .seg {
    display: flex;
    gap: 4px;
  }
  .seg button {
    min-width: 46px;
    min-height: 34px;
    border-radius: 10px;
    border: 1px solid rgba(214, 162, 74, 0.4);
    background: transparent;
    font-weight: 800;
  }
  .seg button[aria-pressed='true'] {
    background: var(--brass);
    color: var(--ink);
  }
  .dev {
    font-size: 13px;
    color: var(--cream-soft);
    background: rgba(0, 0, 0, 0.25);
    border-radius: 12px;
    padding: 10px 12px;
    font-variant-numeric: tabular-nums;
    line-height: 1.5;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(52px, 1fr));
    gap: 7px;
    max-height: 55vh;
    overflow: auto;
    padding: 4px;
  }
  .lv {
    position: relative;
    height: 48px;
    border-radius: 12px;
    border: 1px solid rgba(214, 162, 74, 0.35);
    background: rgba(255, 255, 255, 0.05);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  .lv.done {
    background: rgba(143, 204, 105, 0.16);
    color: var(--leaf);
  }
  .lv.cur {
    background: var(--glow);
    color: var(--ink);
  }
  .lv.hard {
    border-color: #f07a16;
    border-width: 2px;
  }
  .lv.veryHard {
    border-color: var(--danger);
    border-width: 3px;
  }
  .sheet h3 {
    margin: 14px 0 4px;
    font-size: 13px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--brass);
  }
  /* Ana menü: dükkânın */
  .home {
    position: absolute;
    inset: 0;
    z-index: 15;
    display: grid;
    grid-template-rows: auto auto 1fr auto auto;
    gap: 6px;
    padding: 10px max(14px, env(safe-area-inset-right, 0px))
      max(8px, env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px));
    background:
      radial-gradient(ellipse 80% 50% at 50% 45%, rgba(22, 11, 5, 0.35), rgba(22, 11, 5, 0.75)),
      url(__ASSET:bg_bazaar.jpg__) center 35% / cover;
    animation: fade 200ms ease-out both;
  }
  .home-top {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .coins.big {
    font-size: 18px;
    padding: 7px 14px 7px 7px;
  }
  .coins.big .coin {
    width: 26px;
    height: 26px;
  }
  .home-top .iconbtn {
    margin-left: auto;
  }
  .gift-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    min-height: 44px;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1.5px solid #e6b85a;
    background: rgba(200, 68, 58, 0.25);
    font-weight: 800;
    animation: glow 1.4s ease-in-out infinite;
  }
  .gift-btn svg {
    width: 24px;
    height: 24px;
  }
  .shop-bar {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .shop-name {
    flex: 1;
    min-width: 0;
    text-align: center;
    display: flex;
    flex-direction: column;
  }
  .shop-name span {
    font-family: var(--font-display);
    font-size: 26px;
    line-height: 1.05;
    text-shadow: 0 2px 0 rgba(0, 0, 0, 0.5);
  }
  .shop-name small {
    color: var(--cream-soft);
    font-size: 13px;
  }
  .arrow {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid rgba(214, 162, 74, 0.5);
    background: rgba(0, 0, 0, 0.3);
    font-size: 26px;
    line-height: 1;
  }
  .arrow[disabled] {
    opacity: 0.25;
  }
  .stall {
    min-height: 0;
    display: grid;
    place-items: end center;
  }
  .stall-svg {
    width: 100%;
    max-height: 100%;
    max-width: 460px;
    filter: drop-shadow(0 12px 20px rgba(0, 0, 0, 0.55));
  }
  .stall-svg .tag,
  .stall-svg .ghost,
  .stall-svg .part {
    cursor: pointer;
  }
  .stall-svg .tag {
    animation: tagbob 2.4s ease-in-out infinite;
  }
  @keyframes tagbob {
    50% {
      translate: 0 -3px;
    }
  }
  .home-actions {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 10px;
  }
  .btn.play {
    flex-direction: column;
    gap: 0;
    min-height: 62px;
    font-size: 22px;
    font-family: var(--font-display);
    font-weight: 400;
