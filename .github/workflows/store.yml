# App Store Connect: mağaza sayfası, ekran görüntüleri, yaş derecesi, fiyat ve gizlilik (store/ klasörü).
# Sırlar ios.yml ile aynı. Kayıtlar herkese açık olduğundan betikler yalnızca kimlik ve durum yazdırır.
name: App Store
on:
  workflow_dispatch:
    inputs:
      task:
        description: 'probe (yalnızca oku) | sync (mağaza bilgilerini yaz) | where (sırlar nerede, yalnızca evet/hayır)'
        required: true
        default: probe
concurrency:
  group: store
  cancel-in-progress: false
jobs:
  store:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: APPSTORE_API_KEY_P8
    env:
      P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
      KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sırlar nerede (değer yazdırılmaz, yalnızca var/yok)
        run: |
          echo "Secrets   APPSTORE_API_KEY_P8=${{ secrets.APPSTORE_API_KEY_P8 != '' }} APPSTORE_KEY_ID=${{ secrets.APPSTORE_KEY_ID != '' }} APPSTORE_ISSUER_ID=${{ secrets.APPSTORE_ISSUER_ID != '' }} APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID != '' }}"
          echo "Variables APPSTORE_API_KEY_P8=${{ vars.APPSTORE_API_KEY_P8 != '' }} APPSTORE_KEY_ID=${{ vars.APPSTORE_KEY_ID != '' }} APPSTORE_ISSUER_ID=${{ vars.APPSTORE_ISSUER_ID != '' }} APPLE_TEAM_ID=${{ vars.APPLE_TEAM_ID != '' }}"
          echo "Diğer olası adlar (Secrets): KEY_ID=${{ secrets.KEY_ID != '' }} ISSUER_ID=${{ secrets.ISSUER_ID != '' }} TEAM_ID=${{ secrets.TEAM_ID != '' }} P8=${{ secrets.P8 != '' }} ASC_KEY_ID=${{ secrets.ASC_KEY_ID != '' }} APP_STORE_CONNECT_API_KEY=${{ secrets.APP_STORE_CONNECT_API_KEY != '' }}"
          echo "Diğer olası adlar (Variables): KEY_ID=${{ vars.KEY_ID != '' }} ISSUER_ID=${{ vars.ISSUER_ID != '' }} TEAM_ID=${{ vars.TEAM_ID != '' }} KeyID=${{ vars.KeyID != '' }} IssuerID=${{ vars.IssuerID != '' }} TeamID=${{ vars.TeamID != '' }}"
      - name: API anahtarı
        if: inputs.task != 'where'
        run: |
          trim() { printf '%s' "$1" | tr -d '[:space:]'; }
          [ -z "$P8" ] && { echo "::error::APPSTORE_API_KEY_P8 yok"; exit 1; }
          body=$(printf '%s' "$P8" | sed 's/\\n/ /g' | sed 's/-----[A-Z ]*-----//g' | tr -d '[:space:]')
          mkdir -p "$RUNNER_TEMP/keys"
          { echo "-----BEGIN PRIVATE KEY-----"; printf '%s' "$body" | fold -w 64; echo; echo "-----END PRIVATE KEY-----"; } > "$RUNNER_TEMP/keys/key.p8"
          openssl pkey -in "$RUNNER_TEMP/keys/key.p8" -noout 2>/dev/null || { echo "::error::.p8 geçersiz"; exit 1; }
          {
            echo "ASC_KEY_ID=$(trim "$KEY_ID")"
            echo "ASC_ISSUER_ID=$(trim "$ISSUER_ID")"
            echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/key.p8"
          } >> "$GITHUB_ENV"
      - name: ${{ inputs.task }}
        if: inputs.task != 'where'
        run: node store/${{ inputs.task == 'sync' && 'sync' || 'probe' }}.mjs
